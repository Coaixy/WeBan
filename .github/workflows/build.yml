name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.12"
          cache-python: true
          enable-cache: true
        env:
          UV_PYTHON_PREFERENCE: only-managed

      - run: uv sync

      - name: Build executable
        shell: bash
        run: |
          os_name=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')
          arch=$(echo "${{ runner.arch }}" | tr '[:upper:]' '[:lower:]')
          ext=""
          [[ "$os_name" == "windows" ]] && ext=".exe"
          name="WeBan-${os_name}-${arch}${ext}"

          sep=$(python -c "import os; print(os.pathsep)")
          uv run pyinstaller --noconfirm --onefile \
            --name "$name" \
            --add-data "captcha_model.onnx${sep}." \
            --add-data "answer/answer.json${sep}answer/answer.json" \
            --add-data "config.example.toml${sep}." \
            --hidden-import nodriver \
            --hidden-import loguru \
            --hidden-import numpy \
            --hidden-import cv2 \
            --collect-submodules nodriver \
            main.py

          echo "name=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.name }}
          path: dist/${{ env.name }}*
          if-no-files-found: error

  release:
    name: Release
    permissions:
      contents: write
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: WeBan-*
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
